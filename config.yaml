# WorkPulse configuration. Edit freely: the running tracker reloads it within ~10 s.
# Changes made in the dashboard's Settings tab are stored in data/settings.yaml (merged on top of this file).

tracking:
  sample_interval_s: 5        # how often the agent checks your state
  idle_after_s: 120           # no input for 2 min  -> idle
  away_after_s: 600           # no input for 10 min -> away (also: screen locked / sleep)
  flush_interval_s: 15        # how often sessions are written to the DB

agent:
  # auto   = send to the backend; if it isn't running, write straight to the local DB (nothing gets stuck)
  # http   = backend only (buffered in data/outbox.jsonl while it's down)
  # direct = local DB only
  mode: auto

server:
  host: 127.0.0.1             # localhost only. Don't change to 0.0.0.0 unless you know why.
  port: 8787                  # dashboard: http://127.0.0.1:8787
  # Paired phones on your Wi-Fi can connect (mobile app). Don't edit this line: `.\workpulse lan on|off` and the
  # dashboard toggle save the real value in data/settings.yaml, which overrides it. Check with `.\workpulse lan`.
  lan: false

whatsapp:
  enabled: true
  provider: twilio            # twilio (sandbox) | meta (WhatsApp Cloud API) | console (no sending, just logs)
  public_url: ""              # optional, your tunnel URL e.g. https://abc.ngrok-free.app (for signature checks)
  schedule:                   # local time, 24h. "" turns one off.
    morning: "08:00"
    midday: "13:30"
    night: "21:30"
    weekly: "sun 19:00"
  nudges:
    enabled: true
    entertainment_min: 60     # ping when today's Entertainment passes 1h, 2h, ...
    idle_min: 120             # laptop on but unused this long in work hours (0 = off)
    work_hours: ["10:00", "20:00"]
    quiet_hours: ["23:00", "07:30"]
    task_reminder_hours: 24

coach:
  model: claude-opus-5-5      # needs ANTHROPIC_API_KEY in .env; without it, plain templates are used
  effort: low
  max_tokens: 4000
  fallbacks: true

