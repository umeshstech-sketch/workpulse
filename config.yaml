  # Title rules, checked top to bottom; first match wins.
  # `any`: title contains at least one of these. `and_any` (optional): AND at least one of these.
  # By default rules only apply to browsers; set `all_apps: true` to apply to every app.
  title_rules:
    - any: [youtube]
      and_any: [tutorial, course, lecture, "how to", explained, crash course, freecodecamp, "machine learning", " ml ", python, "deep learning", leetcode, "system design", podcast]
      category: Learning/AI
    - any: [youtube studio]
      category: Content Creation
    - any: [youtube, netflix, prime video, hotstar, jiocinema, instagram, reddit, twitch, "x.com", twitter, facebook, 9gag, crunchyroll]
      category: Entertainment
    - any: [github, gitlab, stack overflow, stackoverflow, localhost, 127.0.0.1, vercel, netlify, render.com, "docs.python", mdn, devpost, replit, codeforces, leetcode, hackerrank]
      category: Coding
    - any: [chatgpt, claude, gemini, perplexity, hugging face, huggingface, kaggle, colab, coursera, udemy, nptel, arxiv, medium, papers with code, deeplearning.ai, wikipedia]
      category: Learning/AI
    - any: [figma, canva, dribbble, behance]
      category: Design
    - any: [gmail, outlook, whatsapp, slack, discord, telegram, linkedin, google meet, zoom, teams]
      category: Communication
    - any: [capcut, descript, "creator studio", notion]
      category: Content Creation

