privacy:
  capture_titles: true        # set false to never store window titles (they're still used in memory to pick a category)
  # Apps (process name, no .exe) and title keywords that are NEVER logged.
  # Matching time is stored only as app "(private)" with no title.
  exclude_apps: [keepass, keepassxc, 1password, bitwarden]
  # Applied to laptop window titles AND phone app names/packages (com.something.bank).
  exclude_keywords: [bank, banking, netbanking, paytm, phonepe, "google pay", paisa, gpay, bhim, ippb, yono, imobile,
                     "payments bank", wallet, incognito, inprivate, "private browsing", password, keepass, bitwarden, 1password]

scoring:
  productive_categories: [Coding, Learning/AI, Design, Content Creation]
  daily_target_min: 240       # productive minutes for full "deep work" points
  streak_break_tolerance_min: 3
  streak_target_min: 90       # a streak this long earns full streak points
  min_break_min: 5            # gaps between active time shorter than this aren't counted as breaks

categories:
  default: Other
  # Browsers get their category from the window title (rules below), else "Browsing".
  browsers: [chrome, msedge, firefox, brave, opera, vivaldi, arc, zen]

